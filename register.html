<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - GamerConnections</title>
    <link rel="stylesheet" href="styles.css?v=6">
    <link rel="icon" type="image/png" href="assets/logo.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-animation"></div>
    
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <img class="logo-img" src="assets/logo.png?v=2" alt="GamerConnections">
                <span class="logo-text">GamerConnections</span>
            </a>
        </div>
    </header>

    <main class="auth-page">
        <div class="container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Crie sua conta, <span class="gradient-text">Gamer</span></h1>
                    <p>Junte-se à comunidade e encontre seu Player 2</p>
                </div>

                <form id="registerForm" class="auth-form" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nome">Nome Completo <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required autocomplete="name">
                            </div>
                            <span class="error-message" id="nomeError"></span>
                        </div>
                        <div class="form-group">
                            <label for="username">Username <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <span class="input-prefix">$</span>
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                                <input type="text" id="username" name="username" placeholder="Escolha seu $username" required autocomplete="username" pattern="[a-zA-Z0-9_]{3,20}" minlength="3" maxlength="20">
                            </div>
                            <span class="error-message" id="usernameError"></span>
                            <span class="helper-text">3-20 caracteres, apenas letras, números e _</span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                    <polyline points="22,6 12,13 2,6"/>
                                </svg>
                                <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email">
                            </div>
                            <span class="error-message" id="emailError"></span>
                        </div>
                        <div class="form-group">
                            <label for="birthdate">Data de Nascimento <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                    <line x1="16" y1="2" x2="16" y2="6"/>
                                    <line x1="8" y1="2" x2="8" y2="6"/>
                                    <line x1="3" y1="10" x2="21" y2="10"/>
                                </svg>
                                <input type="date" id="birthdate" name="birthdate" required>
                            </div>
                            <span class="error-message" id="birthdateError"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Senha <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required autocomplete="new-password" minlength="8">
                                <button type="button" class="toggle-password" aria-label="Mostrar/ocultar senha">
                                    <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                        <line x1="1" y1="1" x2="23" y2="23"/>
                                    </svg>
                                </button>
                            </div>
                            <span class="error-message" id="passwordError"></span>
                            <div class="password-strength">
                                <div class="strength-bar">
                                    <div class="strength-fill" id="strengthFill"></div>
                                </div>
                                <span class="strength-text" id="strengthText">Força da senha</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirmar Senha <span class="required">*</span></label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirme sua senha" required autocomplete="new-password">
                                <button type="button" class="toggle-password" aria-label="Mostrar/ocultar senha">
                                    <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                        <line x1="1" y1="1" x2="23" y2="23"/>
                                    </svg>
                                </button>
                            </div>
                            <span class="error-message" id="confirmPasswordError"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Você é <span class="required">*</span></label>
                            <div class="pill-pick" id="regGender">
                                <label><input type="radio" name="gender" value="M"> Masculino</label>
                                <label><input type="radio" name="gender" value="F"> Feminino</label>
                                <label><input type="radio" name="gender" value="O"> Outro</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Busco <span class="required">*</span></label>
                            <div class="pill-pick" id="regBusco">
                                <label><input type="radio" name="busco" value="F"> Mulheres</label>
                                <label><input type="radio" name="busco" value="M"> Homens</label>
                                <label><input type="radio" name="busco" value="both"> Ambos</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Quero <span class="required">*</span></label>
                        <div class="pill-pick" id="regWant">
                            <label><input type="checkbox" name="want" value="Amizade"> Amizade</label>
                            <label><input type="checkbox" name="want" value="Namoro"> Namoro</label>
                            <label><input type="checkbox" name="want" value="Duo"> Duo</label>
                        </div>
                    </div>

                    <div class="form-group avatar-section">
                        <label>Avatar <span class="required">*</span></label>
                        <div class="avatar-selector">
                            <div class="avatar-preview-wrapper">
                                <img id="avatarPreview" src="assets/avatars/avatar1.svg?v=2" alt="Preview do avatar" class="avatar-preview">
                                <label for="avatarUpload" class="avatar-upload-label">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                        <polyline points="17 8 12 3 7 8"/>
                                        <line x1="12" y1="3" x2="12" y2="15"/>
                                    </svg>
                                </label>
                                <input type="file" id="avatarUpload" name="avatarUpload" accept="image/*" hidden>
                            </div>
                            <div class="avatar-options">
                                <span class="avatar-label">Ou escolha um avatar:</span>
                                <div class="avatar-grid" id="avatarGrid">
                                    <!-- Avatares serão inseridos via JS -->
                                </div>
                            </div>
                            <span class="error-message" id="avatarError"></span>
                            <input type="hidden" id="selectedAvatar" name="avatar" value="assets/avatars/avatar1.svg?v=2">
                        </div>
                    </div>

                    <div class="form-group terms-group">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="terms" name="terms" required>
                            <span class="checkmark"></span>
                            Concordo com os <a href="#">Termos de Uso</a> e <a href="#">Política de Privacidade</a>
                        </label>
                        <span class="error-message" id="termsError"></span>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full btn-large">
                        <span class="btn-text">Criar Conta</span>
                        <span class="btn-loader" style="display:none">
                            <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
                                <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
                            </svg>
                        </span>
                    </button>

                    <p class="auth-footer">
                        Já tem conta? <a href="login.html">Faça login</a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 GamerConnections. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js?v=6"></script>
</body>
</html>
